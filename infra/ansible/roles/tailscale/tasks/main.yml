- name: Tailscale の APT リポジトリ鍵を置く
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_url }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: "{{ tailscale_keyring }}"
    mode: "0644"

- name: Tailscale の APT リポジトリを追加する
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ tailscale_keyring }}] {{ tailscale_repo_url }} {{ ansible_facts['distribution_release'] }} main"
    filename: tailscale

- name: Tailscale を入れる
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: 接続状態を確認する
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Tailnet に参加する
  ansible.builtin.command: "tailscale up --authkey={{ tailscale_authkey }} {{ tailscale_args }}"
  when: >-
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState != 'Running'
  no_log: true
  changed_when: true
